name: Publish npm package

on:
  push:
    tags: ["v*"]

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@12.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          npm_version="$(node -p 'require("./npm/package.json").version')"
          expected_tag="v${python_version}"
          test "${npm_version}" = "${python_version}"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Run Python tests
        run: uv run -m unittest discover -s tests -p 'test_*.py'
      - name: Check Python quality
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv build
      - name: Test and inspect npm package
        working-directory: npm
        run: |
          npm test
          npm pack --dry-run
      - name: Publish npm package with provenance
        working-directory: npm
        run: npm publish --access public --provenance
